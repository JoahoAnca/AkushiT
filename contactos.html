<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos</title>
    <link rel="icon" href="logoAT3.png" type="image/png">
    <link rel="stylesheet" href="efectos.css">

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script src="productos.js" defer></script>
    <script src="buscador.js" defer></script>
    <script src="contactos.js" defer></script>
</head>

<body>
    <header>
        <a href="index.html">
            <img src="diosAkushi.png" alt="Logo AkushiT" height="150px">
        </a>
        <div class="container">
            <input type="text" id="buscador" placeholder="Buscar...">
            <div id="resultados"></div>
        </div>
        <nav>
            <ul>
                <li><a href="carrito_compras.html">Carrito de compras</a></li>
                <li><a href="contactos.html">Contactos</a></li>
            </ul>
        </nav>
    </header>

    <main class="contacto-container">
        <h2>Contáctanos</h2>

        <form id="formulario-contacto">
            <label for="nombre">Nombre completo</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required><br><br>

            <label for="email">Correo electrónico</label><br>
            <input type="email" id="email" name="email" placeholder="Tu correo" required><br><br>

            <label for="mensaje">Mensaje</label><br>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje..." required></textarea><br><br>

            <button type="submit">Enviar mensaje</button>
        </form>
    </main>
    <footer class="pie-pagina">
        <p>Cualquier duda a este número: <strong>+51 949 749 592</strong></p>
    </footer>
</body>
</html>
