<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto</title>
    <link rel="icon" href="logoAT3.png" type="image/png">
    <link rel="stylesheet" href="efectos.css">

    <script src="productos.js" defer></script>
    <script src="funciones.js" defer></script>   
    <script src="buscador.js" defer></script>
    <script src="producto.js" defer></script>
</head>

<body>
    <header>
        <a href="index.html">
            <img src="diosAkushi.png" alt="Logo AkushiT" height="150px">
        </a>
        <div class="container">
            <input type="text" id="buscador" placeholder="Buscar...">
            <div id="resultados"></div>
        </div>
        <nav>
            <ul>
                <li><a href="carrito_compras.html">Carrito de compras</a></li>
                <li><a href="contactos.html">Contactos</a></li>
            </ul>
        </nav>
    </header>

    <main class="detalle-producto">
    <div class="galeria-contenedor" style="position: relative; max-width: 400px; text-align: center;">
        
        <!-- Aquí se mostrará la imagen o el video dinámicamente -->
        <div id="visoresGaleria" style="width: 100%; height: 350px; display: flex; align-items: center; justify-content: center;">
            <img id="imagen" alt="Imagen del producto" style="max-width: 100%; max-height: 100%; object-fit: contain;">
            <video id="videoProducto" controls style="max-width: 100%; max-height: 100%; display: none;"></video>
        </div>

        <!-- Botones de flechas para cambiar de modelo/video -->
        <div id="controlesGaleria" style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
            <button id="btnAnterior" style="padding: 8px 15px; cursor: pointer;">&larr; Anterior</button>
            <span id="indicadorGaleria" style="font-weight: bold; font-size: 14px;">1 / 1</span>
            <button id="btnSiguiente" style="padding: 8px 15px; cursor: pointer;">Siguiente &rarr;</button>
        </div>
    </div>

    <div class="info-producto">
        <h1 id="nombre"></h1>
        <h2 id="precio"></h2>
        <p id="descripcion"></p>
        <button id="btnCarrito">Agregar al carrito</button>
        <button id="btnComprar">Comprar ahora</button>
    </div>
</main>
</body>
</html>
